<div class="keynote">
    <h3><a href="{{ .Get "speaker_url" }}" style="text-decoration: underline;">{{ .Get "name" }}</a>, {{ .Get "affiliation" }}, {{ .Get "country" }}</h3>
    <p><strong>Title:</strong> {{ .Get "title" }}</p>
    <p><strong>Abstract:</strong> {{ .Get "abstract" }}</p>
    <p><strong>Bio:</strong> {{ .Get "bio" }}</p>
</div>
